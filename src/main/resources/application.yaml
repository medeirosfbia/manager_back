spring:
  jpa:
    generate-ddl: true
    database: postgresql
    show-sql: true
    properties:
      jakarta.persistence.sharedCache.mode: ENABLE_SELECTIVE
  datasource:
    url: jdbc:postgresql://${POSTGRESHOST}:${POSTGRESPORT}/${POSTGRESDATABASE}
    username: ${POSTGRESUSER}
    password: ${POSTGRESPASSWORD}
  servlet:
    multipart:
      # Fotos de perfil: o serviço também recusa acima de 5 MB
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Brazil/East

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    disable-swagger-default-url: true
    packagesToScan: com.manager.controller
    use-root-path: true

server:
  port: 8090

security:
  jwt:
    secret: ${JWT_SECRET_B64}

# Admin criado pelo AdminSeeder na inicialização (só se ADMIN_PASSWORD estiver definido)
admin:
  default:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@aprovia.com}
    password: ${ADMIN_PASSWORD:}

# Fotos de perfil no Azure Blob. Sem a connection string, as rotas de upload respondem 503.
azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    profile-pictures-container: ${PROFILE_PICTURES_CONTAINER:aprovia-profile-pictures}
